# docker compose up --build     ->  http://localhost:8000
# Builds the CPU-only image from this repo (no PyTorch, about 700 MB on disk). To use a published image instead:
#   APERTURE_IMAGE=akbardebug/aperture-face:latest docker compose up
# Or without compose:  docker run -p 8000:8000 akbardebug/aperture-face
services:
  aperture:
    image: ${APERTURE_IMAGE:-aperture-face:latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
